# Tuỳ chọn: Chạy nhanh PostgreSQL 17 bằng Docker Compose (theo Chương 2 - Phần A, Mục 2.1.2)
services:
  db:
    image: postgres:17
    container_name: eduhub-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduhub_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eduhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eduhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-eduhub} -d $${POSTGRES_DB:-eduhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eduhub-pgdata:
